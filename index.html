<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Equilibra · La flor de tu semana</title>
<meta name="description" content="Equilibra: puntúa cada semana las 8 áreas de tu vida, mira tu flor y elige una pequeña acción para equilibrarla.">
<meta name="theme-color" content="#140f26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Equilibra">
<link rel="icon" id="favicon">
<link rel="apple-touch-icon" href="img/icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#140f26; --fondo2:#1d1636; --tarjeta:#221a40; --tinta:#f4f0fb; --suave:#a99fca; --linea:#352a5c;
  --acento:#f08a24; --acento2:#e2456b; --oro:#f7c35b; --sube:#4ade80; --baja:#fb7185;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(120% 60% at 50% 0%,#2a1f52 0,var(--fondo) 60%) fixed,var(--fondo);color:var(--tinta);
  font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{line-height:1.2;margin:0}
.envoltura{max-width:520px;margin:0 auto;padding:0 16px 110px}

/* Cabecera */
header.cab{position:sticky;top:0;z-index:5;background:rgba(20,15,38,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--linea)}
.cab-in{max-width:520px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.cab-in .marca{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:.2px}
.cab-in .marca svg{width:30px;height:30px;overflow:visible}
.cab-in .ver{font-size:11px;font-weight:700;color:var(--suave);border:1px solid var(--linea);border-radius:999px;padding:1px 7px}
.cab-in .der{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn-son{width:34px;height:34px;border-radius:50%;border:1px solid var(--linea);background:transparent;font-size:15px;display:grid;place-items:center;padding:0}
#grow-panel-boton .gp-boton{border-color:var(--linea)}

/* Tarjetas y botones */
.tarjeta{background:var(--tarjeta);border:1px solid var(--linea);border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:14px 18px;font-weight:800;font-size:16px}
.btn.prim{background:linear-gradient(135deg,var(--acento),var(--acento2));color:#fff;box-shadow:0 6px 20px rgba(226,69,107,.35)}
.btn.prim:active{transform:translateY(1px)}
.btn.sec{background:rgba(255,255,255,.04);border:1.5px solid var(--linea);color:var(--tinta)}
.btn.ancho{width:100%}
.btn.peligro{background:transparent;border:1.5px solid #6b2a3f;color:var(--baja)}
.link{background:none;border:0;padding:6px 4px;color:var(--suave);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.suave{color:var(--suave)}
.peq{font-size:13px}

/* Flor */
.flor{display:block;width:100%;max-width:330px;margin:4px auto 0;overflow:visible}
.flor .petalo{animation:abre .9s cubic-bezier(.2,.9,.25,1.15) both;transform-origin:0px 0px}
@keyframes abre{from{transform:scale(0) rotate(-25deg);opacity:0}}
.flor .centro{animation:late 1.1s ease-out .55s both;transform-origin:0px 0px}
@keyframes late{0%{transform:scale(0)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.flor .eti-num{font-size:12px;font-weight:800;fill:var(--tinta)}
.mini{width:64px;height:64px;flex:none;margin:0}
.leyenda-prev{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--suave);margin-top:4px}
.leyenda-prev i{display:inline-block;width:22px;border-top:2px dashed #cbbcf5}

/* Cifras */
.cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.cifra{background:rgba(255,255,255,.04);border:1px solid var(--linea);border-radius:14px;padding:10px 8px;text-align:center}
.cifra b{display:block;font-size:20px;font-weight:800}
.cifra span{font-size:12px;color:var(--suave)}
.delta{font-size:12px;font-weight:800;white-space:nowrap}
.delta.up{color:var(--sube)} .delta.down{color:var(--baja)} .delta.igual{color:var(--suave)}

/* Lista de áreas */
.areas{margin-top:12px}
.fila{display:grid;grid-template-columns:26px 1fr 70px 30px 34px;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--linea)}
.fila:first-child{border-top:0}
.fila .em{display:flex;justify-content:center}
.fila .em .ico{width:18px;height:18px}
.ico{width:15px;height:15px;vertical-align:-2px;flex:none;display:inline-block}
.ico.g{width:26px;height:26px}
.fila .nom{font-weight:700;font-size:15px;line-height:1.2}
.fila .nom small{display:block;font-weight:600;font-size:12px;color:var(--suave)}
.fila .barra{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.fila .barra i{display:block;height:100%;border-radius:99px}
.fila b{text-align:right;font-size:16px}
.fila .delta{text-align:right}

/* Bienvenida */
.bienvenida{text-align:center;padding:0;overflow:hidden}
.bienvenida .hero{position:relative;height:300px;background:url(img/flor.jpg) center 28%/cover}
.bienvenida .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 45%,var(--tarjeta))}
.bienvenida .txt{padding:0 20px 22px;margin-top:-30px;position:relative}
.bienvenida h1{font-size:26px;font-weight:800}
.bienvenida p{margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 18px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;
  background:color-mix(in srgb,var(--c) 18%,transparent);color:color-mix(in srgb,var(--c) 55%,#fff);border:1.5px solid transparent}
button.chip.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 32%,transparent);color:#fff}

/* Acción */
.accion{border-left:5px solid var(--c,var(--acento))}
.accion .eti{font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--suave);margin:0}
.accion .txt{font-size:18px;font-weight:700;margin:6px 0 12px}
.accion.hecha .txt{text-decoration:line-through;text-decoration-color:var(--c);color:var(--suave)}
.accion .acc-bots{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.aviso-semana{border-color:#6b4a1f;background:linear-gradient(135deg,#3a2a17,#2a1f3f)}

/* Evaluar */
.progreso{display:flex;gap:5px;margin-top:14px}
.progreso i{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.1)}
.progreso i.hecho{background:var(--c)}
.progreso i.actual{background:color-mix(in srgb,var(--c) 55%,transparent)}
.paso{font-size:13px;color:var(--suave);font-weight:700;margin:8px 0 0}
.eval{padding:0;overflow:hidden;text-align:center;animation:entra .45s ease-out both}
@keyframes entra{from{opacity:0;transform:translateX(24px)}}
.eval .ilus{position:relative;height:270px;background:var(--fondo2) center 30%/cover}
.eval .ilus::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,var(--tarjeta) 98%)}
.eval .cuerpo{padding:0 18px 20px;margin-top:-44px;position:relative}
.eval h2{font-size:25px;font-weight:800;margin-top:4px;color:color-mix(in srgb,var(--c) 55%,#fff)}
.pregunta{display:block;font-size:17px;font-weight:700;margin:16px 4px 0}
.valor{font-size:46px;font-weight:800;color:color-mix(in srgb,var(--c) 70%,#fff);line-height:1.1;margin-top:4px;transition:transform .15s}
.valor.pulso{transform:scale(1.15)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:99px;margin:10px 0 6px;outline:none;
  background:linear-gradient(to right,var(--c) calc(var(--p,44.4)*1%),rgba(255,255,255,.12) 0)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:4px solid var(--c);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 25%,transparent)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid var(--c)}
.extremos{display:flex;justify-content:space-between;font-size:12px;color:var(--suave);font-weight:600}
.nota-doble{margin-top:16px;background:rgba(255,255,255,.05);border-radius:14px;padding:12px;font-weight:700}
.nota-doble b{color:color-mix(in srgb,var(--c) 70%,#fff);font-size:20px}
.nota-doble .pista{display:block;font-weight:600;font-size:13px;color:var(--suave);margin-top:2px}
details.nota{margin-top:14px;text-align:left}
details.nota summary{cursor:pointer;color:var(--suave);font-weight:700;font-size:14px;list-style:none;text-align:center}
details.nota summary::-webkit-details-marker{display:none}
textarea,input[type=text]{width:100%;font:inherit;border:1.5px solid var(--linea);border-radius:12px;padding:11px 12px;background:rgba(0,0,0,.2);color:var(--tinta)}
textarea::placeholder,input::placeholder{color:#7f74a3}
textarea{min-height:80px;resize:vertical;margin-top:8px}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--acento)}
.bots-eval{display:flex;gap:10px;margin-top:16px}
.bots-eval .btn{flex:1}

/* Resultado */
.res-tit{text-align:center;margin-top:18px}
.res-tit h1{font-size:24px;font-weight:800}
.res-tit p{margin:4px 0 0}
.resumen-txt{margin:12px 0 0;text-align:center}
.campo-accion{margin-top:12px}

/* Jardín (historial) */
.evolucion svg{width:100%;height:auto;display:block}
.jardin{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.maceta{background:var(--tarjeta);border:1px solid var(--linea);border-radius:18px;padding:12px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.maceta svg{width:110px;height:110px}
.maceta b{font-size:14px}
.maceta span{font-size:12px;color:var(--suave)}
.volver{margin-top:12px}
.comentario{border-top:1px solid var(--linea);padding:8px 0;font-size:14px}
.comentario:first-of-type{border-top:0}

/* Ajustes */
.ajustes h3{font-size:17px;margin-bottom:6px}
.ajustes p{margin:6px 0 12px}
.ajustes .bots{display:flex;flex-direction:column;gap:8px}
.interruptor{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.interruptor input{width:46px;height:26px;accent-color:var(--acento)}

/* Navegación inferior */
nav.abajo{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(20,15,38,.94);backdrop-filter:blur(10px);border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom)}
nav.abajo .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.abajo button{background:none;border:0;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:700;color:var(--suave)}
nav.abajo button span{font-size:20px;line-height:1.1;filter:grayscale(1);opacity:.6}
nav.abajo button.act{color:var(--oro)}
nav.abajo button.act span{filter:none;opacity:1}

/* Sellos de Práctica Integral (Grow Panel\SELLO.md, colores adaptados al tema nocturno) */
.sellos{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:26px 0 6px}
.pi-seal,.gp-seal{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.3px;
  line-height:16px;white-space:nowrap;color:#a99fca;border:1px solid #3d3266;border-radius:999px;padding:6px 12px;text-decoration:none;background:transparent}
.pi-seal::before{content:"";width:7px;height:7px;border-radius:50%;background:#4ADE80}
.gp-seal svg{width:14px;height:14px;flex:none}
.pi-seal:hover{border-color:#4ADE80}
.gp-seal:hover{border-color:#8b5cf6}

/* Portada: la flor se abre */
#splash{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 42%,#3a2470 0,#1b1236 45%,#0d0a1c 100%);transition:opacity .6s ease;overflow:hidden}
#splash.fuera{opacity:0;pointer-events:none}
#splash .logo-s{width:210px;height:210px;overflow:visible}
#splash .logo-s .petalo{animation:abre-s .7s cubic-bezier(.2,.9,.25,1.2) both;transform-origin:0px 0px}
@keyframes abre-s{from{transform:scale(0) rotate(-40deg);opacity:0}}
#splash .logo-s .centro{animation:late .8s ease-out 1.05s both;transform-origin:0px 0px}
#splash .halo{position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(247,195,91,.35),transparent 65%);
  top:50%;left:50%;transform:translate(-50%,-62%) scale(.3);opacity:0;animation:halo 1.6s ease-out 1s forwards}
@keyframes halo{to{transform:translate(-50%,-62%) scale(1);opacity:1}}
#splash h1{font-size:40px;font-weight:800;margin-top:22px;letter-spacing:.5px;animation:sube .8s ease-out 1.2s both}
#splash p{margin:4px 0 0;color:var(--suave);font-weight:600;animation:sube .8s ease-out 1.4s both}
@keyframes sube{from{opacity:0;transform:translateY(12px)}}
#splash .chispa{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--oro);box-shadow:0 0 8px var(--oro);opacity:0;animation:chispa 2.4s ease-out forwards}
@keyframes chispa{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
#splash .tocar{position:absolute;top:calc(18px + env(safe-area-inset-top));right:16px;font-size:12px;color:var(--suave);font-weight:700;opacity:0;transition:opacity .3s}
#splash .tocar.ver{opacity:1}
#splash .sellos{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:16px;right:16px;margin:0;animation:sube .8s ease-out 1.6s both}

/* Aviso flotante */
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#f4f0fb;color:#1d1636;font-weight:800;
  padding:10px 16px;border-radius:12px;opacity:0;transition:.3s;z-index:30;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.ver{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="splash" aria-hidden="true">
  <div class="halo"></div>
  <span class="tocar" id="tocar">🔊 Toca para oír</span>
  <svg class="logo-s" id="logo-splash"></svg>
  <h1>Equilibra</h1>
  <p>La flor de tu semana</p>
  <div class="sellos" id="sellos-splash"></div>
</div>

<header class="cab">
  <div class="cab-in">
    <div class="marca"><svg id="logo-cab"></svg>Equilibra</div>
    <span class="ver" id="ver"></span>
    <div class="der"><button class="btn-son" id="btn-son" onclick="alternarSonido()" aria-label="Sonido"></button><span id="grow-panel-boton"></span></div>
  </div>
</header>

<main class="envoltura" id="app"></main>

<nav class="abajo" id="nav">
  <div class="in">
    <button data-v="inicio" onclick="ir('inicio')"><span>🌸</span>Mi flor</button>
    <button data-v="historial" onclick="ir('historial')"><span>🌷</span>Jardín</button>
    <button data-v="ajustes" onclick="ir('ajustes')"><span>⚙️</span>Ajustes</button>
  </div>
</nav>

<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const VERSION = 'v1.02';
const CLAVE = 'equilibra.datos';
const CLAVE_SONIDO = 'equilibra.sonido';

/* Las 8 áreas = los 8 pétalos (decididas con Gustavo el 19/10/2026). Orden = sentido de las agujas del reloj desde arriba. */
const AREAS = [
  {id:'salud',       nombre:'Salud',                   color:'#22a35a',
   pregunta:'¿Cómo te sientes con tu cuerpo, tu energía y tu descanso?', ejemplo:'caminar 20 minutos el martes y el jueves'},
  {id:'pareja',      nombre:'Pareja',                  color:'#e2456b',
   pregunta:'¿Cómo estás en tu vida de pareja o con tu situación sentimental?', ejemplo:'una cena sin móviles el viernes'},
  {id:'familia',     nombre:'Familia y amigos',        color:'#f08a24',
   pregunta:'¿Qué tan cuidados y presentes están tus vínculos cercanos?', ejemplo:'llamar a un amigo que hace tiempo no veo'},
  {id:'trabajo',     nombre:'Trabajo y dinero',        color:'#2b7fd4',
   dobles:[{id:'gusta', texto:'¿Te gusta lo que haces?', corto:'Te gusta'},
           {id:'dinero',texto:'¿Te da el dinero que necesitas?', corto:'Dinero'}],
   ejemplo:'revisar mis gastos del mes el domingo'},
  {id:'crecimiento', nombre:'Crecimiento personal',    color:'#8b5cf6',
   pregunta:'¿Estás aprendiendo y creciendo como te gustaría?', ejemplo:'leer 10 páginas cada noche'},
  {id:'ocio',        nombre:'Ocio y disfrute',         color:'#e0a810',
   pregunta:'¿Tienes tiempo para disfrutar, jugar y descansar?', ejemplo:'reservar el sábado por la tarde para algo que me guste'},
  {id:'proposito',   nombre:'Propósito / Espiritualidad', color:'#14a3a3',
   pregunta:'¿Sientes que tu vida tiene sentido y dirección?', ejemplo:'10 minutos de silencio o meditación cada mañana'},
  {id:'hogar',       nombre:'Hogar y entorno',         color:'#b0703c',
   pregunta:'¿Te sientes a gusto donde y cómo vives?', ejemplo:'ordenar el escritorio y dejarlo despejado'},
];

const $ = s => document.querySelector(s);
const app = $('#app');
let D = cargar();
let vista = 'inicio';
let E = null;          // flor en curso
let R = null;          // contexto de la pantalla de resultado / acción
let detalleId = null;

/* ---------- Datos ---------- */
function cargar(){
  try{ const d = JSON.parse(localStorage.getItem(CLAVE)); if(d && Array.isArray(d.evaluaciones)) return d; }catch(e){}
  return {evaluaciones:[]};
}
function guardar(){
  try{ localStorage.setItem(CLAVE, JSON.stringify(D)); }catch(e){ aviso('No se pudo guardar en este navegador'); }
  enviarResumen();
}
const ultima = () => D.evaluaciones[D.evaluaciones.length-1] || null;
const porId = id => D.evaluaciones.find(e => e.id === id);
const areaDe = id => AREAS.find(a => a.id === id);
function anterior(ev){ const i = D.evaluaciones.findIndex(e => e.id === ev.id); return i > 0 ? D.evaluaciones[i-1] : null; }
function media(notas){ return Math.round(AREAS.reduce((s,a) => s + (notas[a.id]||0), 0) / AREAS.length * 10) / 10; }
function ordenadas(notas){ return AREAS.slice().sort((x,y) => notas[x.id] - notas[y.id]); }
function fmt(n){ return Number.isInteger(n) ? String(n) : n.toFixed(1).replace('.', ','); }
function diasDesde(f){ const a = new Date(f); a.setHours(0,0,0,0); const b = new Date(); b.setHours(0,0,0,0); return Math.round((b-a)/864e5); }
function fecha(f, larga){
  return new Date(f).toLocaleDateString('es-ES', larga ? {weekday:'long', day:'numeric', month:'long', year:'numeric'} : {day:'numeric', month:'short', year:'numeric'});
}
function esc(t){ return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function deltaHTML(v, prev){
  if(prev == null) return '<span class="delta"></span>';
  const d = Math.round((v - prev)*10)/10;
  if(d > 0) return `<span class="delta up">▲${fmt(d)}</span>`;
  if(d < 0) return `<span class="delta down">▼${fmt(-d)}</span>`;
  return '<span class="delta igual">=</span>';
}

/* Semanas (lunes a domingo) */
function lunes(f){ const d = new Date(f); d.setHours(0,0,0,0); d.setDate(d.getDate() - (d.getDay()+6)%7); return d; }
function claveSemana(f){ const l = lunes(f); return `${l.getFullYear()}-${String(l.getMonth()+1).padStart(2,'0')}-${String(l.getDate()).padStart(2,'0')}`; }
function semanaDe(ev){ return ev.semana || claveSemana(ev.fecha); }
function rangoSemana(clave){
  const [y,m,d] = clave.split('-').map(Number), l = new Date(y, m-1, d), dom = new Date(y, m-1, d+6);
  const o = {day:'numeric', month:'short'};
  return `${l.toLocaleDateString('es-ES', o)} – ${dom.toLocaleDateString('es-ES', o)}`;
}
function textoSemana(clave){
  const hoy = claveSemana(new Date()), pasada = claveSemana(new Date(Date.now() - 7*864e5));
  return clave === hoy ? 'Esta semana' : clave === pasada ? 'La semana pasada' : `Semana del ${rangoSemana(clave)}`;
}
const semanasDesde = ev => Math.round((lunes(new Date()) - lunes(ev.fecha)) / (7*864e5));

/* ---------- Sonidos (Web Audio, sin archivos) ---------- */
let ctxAudio = null;
let sonidoOn = (() => { try{ return localStorage.getItem(CLAVE_SONIDO) !== 'no'; }catch(e){ return true; } })();
const ESCALA = [196.00, 220.00, 246.94, 293.66, 329.63, 392.00, 440.00, 493.88, 587.33, 659.25]; // sol mayor pentatónica
function audio(){
  if(!sonidoOn) return null;
  try{ if(!ctxAudio) ctxAudio = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  if(ctxAudio.state === 'suspended') ctxAudio.resume();
  return ctxAudio;
}
/* Una nota cálida tipo campana con un «brum» grave debajo */
function nota(frec, t0, vol = .22, dur = 1.1, brum = true){
  const c = audio(); if(!c) return;
  const t = c.currentTime + (t0 || 0);
  const salida = c.createGain(); salida.gain.value = vol; salida.connect(c.destination);
  const capas = [[frec,'sine',1],[frec*2,'triangle',.28],[frec*3,'sine',.08]];
  if(brum) capas.push([frec/2,'sine',.55]);
  capas.forEach(([f,tipo,g], i) => {
    const o = c.createOscillator(), e = c.createGain();
    o.type = tipo; o.frequency.setValueAtTime(i === 3 ? f*1.06 : f, t);
    if(i === 3) o.frequency.exponentialRampToValueAtTime(f, t + .18);
    e.gain.setValueAtTime(0.0001, t);
    e.gain.exponentialRampToValueAtTime(g, t + (i === 3 ? .03 : .012));
    e.gain.exponentialRampToValueAtTime(0.0001, t + dur * (i === 3 ? .7 : i === 0 ? 1 : .55));
    o.connect(e); e.connect(salida); o.start(t); o.stop(t + dur + .05);
  });
}
function sonarPaso(i){ nota(ESCALA[Math.min(i, ESCALA.length-1)], 0, .2, .9); }
function sonarMover(v){ const c = audio(); if(!c) return; nota(ESCALA[v-1] * 2, 0, .05, .18, false); }
function sonarFinal(){ [0,2,4,5,7,9].forEach((n,k) => nota(ESCALA[n], k*.09, .16, 1.4, k === 0)); }
function sonarPortada(){ AREAS.forEach((a,i) => nota(ESCALA[i], .12 + i*.11, .14, 1.3, i === 0)); nota(ESCALA[9], 1.15, .12, 2.2, false); }
function sonarHecho(){ nota(ESCALA[5], 0, .15, .6, false); nota(ESCALA[7], .1, .15, .9, false); }
function iconoSonido(){ const b = $('#btn-son'); if(b){ b.textContent = sonidoOn ? '🔊' : '🔇'; b.setAttribute('aria-label', sonidoOn ? 'Silenciar sonidos' : 'Activar sonidos'); } }
function alternarSonido(){
  sonidoOn = !sonidoOn;
  try{ localStorage.setItem(CLAVE_SONIDO, sonidoOn ? 'si' : 'no'); }catch(e){}
  iconoSonido();
  if(sonidoOn) sonarHecho();
  if(vista === 'ajustes') render();
}

/* ---------- Dibujos: la flor ---------- */
function pt(r, ang){ const a = ang*Math.PI/180; return [r*Math.cos(a), r*Math.sin(a)]; }
/* Pétalo apuntando hacia arriba (eje -y), de largo L */
function petalo(L, W){
  const w = W != null ? W : Math.min(34, 14 + L*0.2);
  return `M0 0C${w} ${-L*.28} ${w*.92} ${-L*.78} 0 ${-L}C${-w*.92} ${-L*.78} ${-w} ${-L*.28} 0 0Z`;
}
let idFlor = 0;
function flor(notas, previas, opc = {}){
  const mini = !!opc.mini, paso = 360/AREAS.length, LMAX = 132, n = ++idFlor;
  const vb = mini ? 150 : 192;
  let s = `<svg viewBox="${-vb} ${-vb} ${vb*2} ${vb*2}" class="flor${mini?' mini':''}" role="img" aria-label="Flor de la semana${notas?': media '+fmt(media(notas)):''}">
  <defs><filter id="brillo${n}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="centro${n}"><stop offset="0" stop-color="#ffe59a"/><stop offset=".6" stop-color="#f7b733"/><stop offset="1" stop-color="#d9831f"/></radialGradient></defs>`;
  // guía: el contorno del pétalo «pleno» (10)
  if(!mini) AREAS.forEach((a,i) => { s += `<path d="${petalo(LMAX, 30)}" transform="rotate(${i*paso})" fill="none" stroke="${a.color}" stroke-opacity=".22" stroke-width="1.2"/>`; });
  AREAS.forEach((a,i) => {
    const v = notas && notas[a.id]; if(!(v > 0)) return;
    const L = 18 + (LMAX-18) * v/10;
    s += `<g transform="rotate(${i*paso})"><path class="${mini?'':'petalo'}" style="animation-delay:${i*70}ms" d="${petalo(L)}" fill="${a.color}" ${mini?'':`filter="url(#brillo${n})"`}/>
      <path d="M0 -10L0 ${-L*.82}" stroke="#fff" stroke-opacity=".28" stroke-width="1.4" stroke-linecap="round" ${mini?'':`class="petalo" style="animation-delay:${i*70}ms"`}/></g>`;
  });
  if(previas){
    AREAS.forEach((a,i) => {
      const v = previas[a.id]; if(!(v > 0)) return;
      s += `<path d="${petalo(18 + (LMAX-18)*v/10)}" transform="rotate(${i*paso})" fill="none" stroke="#e9e1ff" stroke-opacity=".75" stroke-width="1.8" stroke-dasharray="5 4"/>`;
    });
  }
  s += `<g class="${mini?'':'centro'}"><circle r="${mini?20:22}" fill="url(#centro${n})"/>`;
  if(!mini) for(let k = 0; k < 14; k++){ const [x,y] = pt(k%2 ? 9 : 15, k*360/14); s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.2" fill="#fff3c4" opacity=".8"/>`; }
  s += '</g>';
  if(!mini && notas){
    AREAS.forEach((a,i) => {
      const [x,y] = pt(165, i*paso - 90);
      s += `<circle cx="${x.toFixed(1)}" cy="${(y-9).toFixed(1)}" r="5" fill="${a.color}"/>`;
      s += `<text class="eti-num" x="${x.toFixed(1)}" y="${(y+8).toFixed(1)}" text-anchor="middle" dominant-baseline="central">${fmt(notas[a.id])}</text>`;
    });
  }
  return s + '</svg>';
}
/* Logo: flor plena, ligeramente irregular, como la ilustración */
const LARGOS_LOGO = [10, 9.4, 9.8, 9.2, 10, 9.4, 9.8, 9.2];
function logoInterior(){
  let s = '<defs><radialGradient id="lc"><stop offset="0" stop-color="#ffe59a"/><stop offset=".6" stop-color="#f7b733"/><stop offset="1" stop-color="#d9831f"/></radialGradient></defs>';
  AREAS.forEach((a,i) => { s += `<g transform="rotate(${i*45})"><path class="petalo" style="animation-delay:${i*110}ms" d="${petalo(88*LARGOS_LOGO[i]/10, 27)}" fill="${a.color}"/></g>`; });
  return s + '<g class="centro"><circle r="19" fill="url(#lc)"/></g>';
}
function logoSVG(){ return `<svg viewBox="-100 -100 200 200" xmlns="http://www.w3.org/2000/svg">${logoInterior()}</svg>`; }

/* Icono de cada área: un pétalo de su color (sustituye a los emojis) */

function filasAreas(ev, prev){
  return '<div class="areas">' + AREAS.map(a => {
    const v = ev.notas[a.id];
    let sub = '';
    if(a.dobles && ev.detalle && ev.detalle[a.id]) sub = `<small>${a.dobles.map(d => `${d.corto} ${ev.detalle[a.id][d.id]}`).join(' · ')}</small>`;
    return `<div class="fila"><span class="em">${ico(a)}</span><span class="nom">${a.nombre}${sub}</span>
      <span class="barra"><i style="width:${v*10}%;background:${a.color}"></i></span><b>${fmt(v)}</b>${deltaHTML(v, prev ? prev.notas[a.id] : null)}</div>`;
  }).join('') + '</div>';
}
function pistaTrabajo(det){
  const a = areaDe('trabajo');
  if(!det) return '';
  const [d1, d2] = a.dobles, v1 = det[d1.id], v2 = det[d2.id];
  if(Math.abs(v1 - v2) < 3) return 'Las dos van parejas.';
  return v1 < v2 ? 'Lo que más tira hacia abajo: que te guste lo que haces.' : 'Lo que más tira hacia abajo: el dinero.';
}

/* ---------- Navegación ---------- */
function ir(v){
  vista = v;
  if(v !== 'evaluar') E = null;
  render();
  window.scrollTo(0, 0);
}
function render(){
  const vistas = {inicio:vInicio, evaluar:vEvaluar, resultado:vResultado, historial:vHistorial, detalle:vDetalle, ajustes:vAjustes};
  app.innerHTML = (vistas[vista] || vInicio)();
  const conNav = ['inicio','historial','detalle','ajustes'].includes(vista);
  $('#nav').style.display = conNav ? '' : 'none';
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('act', b.dataset.v === vista || (vista === 'detalle' && b.dataset.v === 'historial')));
  if(vista === 'evaluar') document.querySelectorAll('input[type=range]').forEach(pintarRango);
}

  h += `<section class="tarjeta">
    <h2>${estaSemana ? 'Tu flor de esta semana' : 'Tu última flor'}</h2>
    <p class="peq suave" style="margin:2px 0 0">${rangoSemana(semU)}</p>
    ${flor(u.notas, prev && prev.notas)}
    ${prev ? `<div class="leyenda-prev"><i></i> flor anterior (${rangoSemana(semanaDe(prev))})</div>` : ''}

      <div class="cifra"><b>${fmt(m)}</b><span>media /10 ${prev ? deltaHTML(m, media(prev.notas)) : ''}</span></div>

    h += `<section class="tarjeta accion" style="--c:${baja.color}">

/* ---------- Hacer la flor ---------- */
function empezar(){
  const u = ultima(), notas = {}, det = {};
  AREAS.forEach(a => {
    notas[a.id] = u ? Math.round(u.notas[a.id]) : 5;
    if(a.dobles){ det[a.id] = {}; a.dobles.forEach(d => det[a.id][d.id] = u && u.detalle && u.detalle[a.id] ? u.detalle[a.id][d.id] : 5); notas[a.id] = promedioDoble(a, det[a.id]); }
  });
  const estaSemana = u && semanaDe(u) === claveSemana(new Date());
  E = {i:0, notas, detalle:det, comentarios: estaSemana ? {...(u.comentarios||{})} : {}};
  vista = 'evaluar'; render(); window.scrollTo(0,0);
  precargar(1);
}
function promedioDoble(a, det){ return Math.round(a.dobles.reduce((s,d) => s + det[d.id], 0) / a.dobles.length * 10) / 10; }
function precargar(i){ if(AREAS[i]) (new Image()).src = `img/${AREAS[i].id}.jpg`; }

function deslizador(id, texto, valor){
  return `<label class="pregunta" for="${id}">${texto}</label>
    <div class="valor" id="${id}-v">${valor}</div>
    <input type="range" min="1" max="10" step="1" id="${id}" value="${valor}" oninput="mover(this)">
    <div class="extremos"><span>1 · Muy lejos de lo que quiero</span><span>10 · Pleno</span></div>`;
}
function vEvaluar(){
  if(!E) return vInicio();
  const a = AREAS[E.i];
  let cuerpo = '';
  if(a.dobles){
    cuerpo = a.dobles.map(d => deslizador('s-'+d.id, d.texto, E.detalle[a.id][d.id])).join('');
    cuerpo += `<div class="nota-doble">Nota del área: <b id="nota-doble">${fmt(E.notas[a.id])}</b><span class="pista" id="pista-doble">${pistaTrabajo(E.detalle[a.id])}</span></div>`;
  }else{
    cuerpo = deslizador('s-nota', a.pregunta, E.notas[a.id]);
  }
  const com = E.comentarios[a.id] || '';
  return `<div style="--c:${a.color}">
    <div class="progreso">${AREAS.map((x,j) => `<i class="${j<E.i?'hecho':j===E.i?'actual':''}" style="--c:${x.color}"></i>`).join('')}</div>
    <p class="paso">Pétalo ${E.i+1} de ${AREAS.length}</p>
    <section class="tarjeta eval">
      <div class="ilus" style="background-image:url(img/${a.id}.jpg)" role="img" aria-label="Ilustración de ${a.nombre}"></div>
      <div class="cuerpo">
        <h2>${a.nombre}</h2>
        ${cuerpo}
        <details class="nota" ${com?'open':''}><summary>＋ Añadir una nota (opcional)</summary>
          <textarea placeholder="¿Algo que quieras recordar sobre esta área?" oninput="E.comentarios['${a.id}']=this.value">${esc(com)}</textarea></details>
      </div>
    </section>
    <div class="bots-eval">
      <button class="btn sec" onclick="atras()">${E.i === 0 ? 'Cancelar' : '← Atrás'}</button>
      <button class="btn prim" onclick="siguiente()">${E.i === AREAS.length-1 ? 'Ver mi flor 🌸' : 'Siguiente →'}</button>
    </div></div>`;
}
function pintarRango(el){ el.style.setProperty('--p', (el.value-1)/9*100); }
function mover(el){
  const v = +el.value, a = AREAS[E.i];
  pintarRango(el);
  const num = $('#'+el.id+'-v');
  num.textContent = v; num.classList.add('pulso'); setTimeout(() => num.classList.remove('pulso'), 120);
  sonarMover(v);
  if(el.id === 's-nota'){ E.notas[a.id] = v; return; }
  E.detalle[a.id][el.id.slice(2)] = v;
  E.notas[a.id] = promedioDoble(a, E.detalle[a.id]);
  $('#nota-doble').textContent = fmt(E.notas[a.id]);
  $('#pista-doble').textContent = pistaTrabajo(E.detalle[a.id]);
}
function atras(){ if(E.i === 0){ ir('inicio'); } else { E.i--; render(); window.scrollTo(0,0); } }
function siguiente(){
  if(E.i < AREAS.length-1){ sonarPaso(E.i); E.i++; render(); window.scrollTo(0,0); precargar(E.i+1); return; }
  sonarFinal();
  const comentarios = {};
  Object.keys(E.comentarios).forEach(k => { const t = (E.comentarios[k]||'').trim(); if(t) comentarios[k] = t; });
  const ahora = new Date(), sem = claveSemana(ahora), u = ultima();
  let ev;
  if(u && semanaDe(u) === sem){
    // Una flor por semana: si ya existe la de esta semana, se actualiza (se conserva la acción)
    Object.assign(u, {fecha: ahora.toISOString(), semana: sem, notas: {...E.notas}, detalle: JSON.parse(JSON.stringify(E.detalle)), comentarios});
    ev = u;
  }else{
    ev = {id: Date.now().toString(36), fecha: ahora.toISOString(), semana: sem, notas: {...E.notas}, detalle: JSON.parse(JSON.stringify(E.detalle)), comentarios};
    D.evaluaciones.push(ev);
  }
  guardar();
  E = null;
  R = {id: ev.id, area: ev.accion ? ev.accion.area : ordenadas(ev.notas)[0].id, nueva: true, texto: ev.accion ? ev.accion.texto : ''};
  vista = 'resultado'; render(); window.scrollTo(0,0);
}

/* ---------- Resultado y acción ---------- */
function editarAccion(){
  const u = ultima();
  R = {id: u.id, area: u.accion ? u.accion.area : ordenadas(u.notas)[0].id, nueva: false, texto: u.accion ? u.accion.texto : ''};
  ir('resultado');
}
function vResultado(){
  const ev = R && porId(R.id);
  if(!ev) return vInicio();
  const prev = anterior(ev), ord = ordenadas(ev.notas), baja = ord[0], alta = ord[ord.length-1], m = media(ev.notas);
  const sel = areaDe(R.area);
  let h = '';
  if(R.nueva){
    h += `<div class="res-tit"><h1>¡Tu flor de la semana! 🌸</h1><p class="suave">${rangoSemana(semanaDe(ev))}</p></div>
    <section class="tarjeta">
      ${flor(ev.notas, prev && prev.notas)}
      ${prev ? `<div class="leyenda-prev"><i></i> flor anterior (${rangoSemana(semanaDe(prev))})</div>` : ''}
      <p class="resumen-txt">Tu media es <b>${fmt(m)}</b> de 10${prev ? ' ' + deltaHTML(m, media(prev.notas)) : ''}.<br>
      El pétalo más largo: <b>${ico(alta)} ${alta.nombre}</b> (${fmt(ev.notas[alta.id])}).<br>
      El que más pide cuidado: <b>${ico(baja)} ${baja.nombre}</b> (${fmt(ev.notas[baja.id])}).</p>
    </section>`;
  }
  h += `<section class="tarjeta accion" style="--c:${sel.color}">
    <h3>Una acción pequeña para esta semana</h3>
    <p class="peq suave" style="margin:6px 0 0">Elige un pétalo. Te proponemos el más corto, pero puedes cambiarlo.</p>
    <div class="chips" style="justify-content:flex-start;margin-bottom:6px">
      ${ord.map(a => `<button class="chip ${a.id===R.area?'sel':''}" style="--c:${a.color}" onclick="elegirArea('${a.id}')">${ico(a)} ${a.nombre} · ${fmt(ev.notas[a.id])}</button>`).join('')}
    </div>
    <div class="campo-accion">
      <input type="text" id="accion" maxlength="120" value="${esc(R.texto)}" placeholder="Por ejemplo: ${esc(sel.ejemplo)}" oninput="R.texto=this.value" onkeydown="if(event.key==='Enter')guardarAccion()">
    </div>
    <div class="bots-eval">
      <button class="btn sec" onclick="ir('inicio')">Ahora no</button>
      <button class="btn prim" onclick="guardarAccion()">Guardar acción</button>
    </div></section>`;
  return h;
}
function elegirArea(id){ R.area = id; const y = window.scrollY; render(); window.scrollTo(0, y); }
function guardarAccion(){
  const t = (R.texto || '').trim();
  if(!t){ aviso('Escribe una acción pequeña y concreta'); const i = $('#accion'); if(i) i.focus(); return; }
  const ev = porId(R.id);
  const misma = ev.accion && ev.accion.texto === t && ev.accion.area === R.area;
  ev.accion = {area: R.area, texto: t, hecha: misma ? ev.accion.hecha : false, fecha: new Date().toISOString()};
  guardar();
  sonarHecho();
  aviso('Acción guardada 🌱');
  ir('inicio');
}
function alternarHecha(){
  const u = ultima(); if(!u || !u.accion) return;
  u.accion.hecha = !u.accion.hecha;
  guardar();
  if(u.accion.hecha){ sonarFinal(); aviso('¡Bien hecho! Tu flor lo nota 🌸'); }
  render();
}

/* ---------- Jardín (historial) ---------- */
function evolucionSVG(){
  const ev = D.evaluaciones; if(ev.length < 2) return '';
  const W = 320, H = 110, px = 16, py = 14;
  const x = i => px + i*(W-2*px)/(ev.length-1), y = v => H - py - (v-1)/9*(H-2*py);
  const pts = ev.map((e,i) => `${x(i).toFixed(1)},${y(media(e.notas)).toFixed(1)}`).join(' ');
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de tu media"><defs><linearGradient id="lev" x1="0" x2="1"><stop offset="0" stop-color="#f08a24"/><stop offset="1" stop-color="#e2456b"/></linearGradient></defs>`;
  [2,4,6,8,10].forEach(v => s += `<line x1="${px}" x2="${W-px}" y1="${y(v)}" y2="${y(v)}" stroke="#fff" stroke-opacity=".07"/>`);
  s += `<polyline points="${pts}" fill="none" stroke="url(#lev)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  ev.forEach((e,i) => s += `<circle cx="${x(i)}" cy="${y(media(e.notas))}" r="4.5" fill="#221a40" stroke="#f7c35b" stroke-width="2.5"/>`);
  return s + '</svg>';
}
function vHistorial(){
  if(!D.evaluaciones.length) return `<section class="tarjeta" style="text-align:center"><h2>Tu jardín</h2><p class="suave">Aquí irá creciendo una flor por cada semana.</p>
    <button class="btn prim" onclick="empezar()">Hacer mi primera flor</button></section>`;
  let h = `<h2 style="margin-top:18px">Tu jardín 🌷</h2><p class="peq suave" style="margin:2px 0 0">Una flor por semana. Toca una para verla.</p>`;
  if(D.evaluaciones.length >= 2) h += `<section class="tarjeta evolucion"><h3 style="font-size:16px">Evolución de tu media</h3>${evolucionSVG()}
    <div class="extremos"><span>${rangoSemana(semanaDe(D.evaluaciones[0]))}</span><span>${rangoSemana(semanaDe(ultima()))}</span></div></section>`;
  h += '<div class="jardin">' + D.evaluaciones.slice().reverse().map(e => {
    return `<button class="maceta" onclick="verDetalle('${e.id}')">${flor(e.notas, null, {mini:true})}
      <b>${textoSemana(semanaDe(e))}</b><span>${rangoSemana(semanaDe(e))}</span><span>Media ${fmt(media(e.notas))} / 10</span></button>`;
  }).join('') + '</div>';
  return h;
}
function verDetalle(id){ detalleId = id; ir('detalle'); }
function vDetalle(){
  const ev = porId(detalleId); if(!ev) return vHistorial();
  const prev = anterior(ev);
  let h = `<button class="link volver" onclick="ir('historial')">← Jardín</button>
    <section class="tarjeta"><h2>${textoSemana(semanaDe(ev))}</h2>
    <p class="peq suave" style="margin:2px 0 0">${rangoSemana(semanaDe(ev))} · media ${fmt(media(ev.notas))} / 10 ${prev ? deltaHTML(media(ev.notas), media(prev.notas)) : ''}</p>
    ${flor(ev.notas, prev && prev.notas)}
    ${prev ? `<div class="leyenda-prev"><i></i> flor anterior (${rangoSemana(semanaDe(prev))})</div>` : ''}
    ${filasAreas(ev, prev)}</section>`;
  const coms = Object.keys(ev.comentarios || {});
  if(coms.length) h += `<section class="tarjeta"><h3 style="font-size:16px">Tus notas</h3>${coms.map(k => { const a = areaDe(k); return `<div class="comentario"><b>${ico(a)} ${a.nombre}:</b> ${esc(ev.comentarios[k])}</div>`; }).join('')}</section>`;
  if(ev.accion){ const a = areaDe(ev.accion.area); h += `<section class="tarjeta accion ${ev.accion.hecha?'hecha':''}" style="--c:${a.color}"><p class="eti">Acción elegida · ${ico(a)} ${a.nombre}</p><p class="txt" style="margin-bottom:0">${esc(ev.accion.texto)} ${ev.accion.hecha?'✓':''}</p></section>`; }
  h += `<button class="btn peligro ancho" style="margin-top:14px" onclick="borrarEval('${ev.id}')">Borrar esta flor</button>`;
  return h;
}
function borrarEval(id){
  if(!confirm('¿Borrar esta flor del jardín? No se puede deshacer.')) return;
  D.evaluaciones = D.evaluaciones.filter(e => e.id !== id);
  guardar(); aviso('Flor borrada'); ir('historial');
}

/* ---------- Ajustes ---------- */
function vAjustes(){
  const n = D.evaluaciones.length;
  return `<h2 style="margin-top:18px">Ajustes</h2>
  <section class="tarjeta ajustes">
    <h3>¿Qué es la flor de Equilibra?</h3>
    <p>Es la rueda de la vida convertida en flor: cada pétalo es un área de tu vida y crece según cómo estás en ella. Una flor con pétalos muy desiguales te muestra dónde poner energía.</p>
    <p class="suave">Haz <b>una flor por semana</b> y elige <b>una sola acción pequeña</b>. Con el tiempo, tu jardín te enseña cómo vas cambiando.</p>
  </section>
  <section class="tarjeta ajustes">
    <label class="interruptor">🔊 Sonidos de la app<input type="checkbox" ${sonidoOn?'checked':''} onchange="alternarSonido()"></label>
  </section>
  <section class="tarjeta ajustes">
    <h3>Tus datos</h3>
    <p class="suave">Se guardan solo en este dispositivo y navegador. Haz una copia de vez en cuando.</p>
    <div class="bots">
      <button class="btn sec" onclick="exportar()">⬇️ Guardar una copia (archivo)</button>
      <button class="btn sec" onclick="$('#importar').click()">⬆️ Recuperar una copia</button>
      <input type="file" id="importar" accept=".json,application/json" hidden onchange="importar(this)">
      <button class="btn peligro" onclick="borrarTodo()">Borrar todos mis datos</button>
    </div>
  </section>
  <p class="peq suave" style="text-align:center;margin-top:18px">Equilibra ${VERSION} · ${n} ${n===1?'flor en tu jardín':'flores en tu jardín'}</p>
  <div class="sellos">${sellosHTML()}</div>`;
}
function exportar(){
  const blob = new Blob([JSON.stringify(D, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `equilibra-copia-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importar(inp){
  const f = inp.files && inp.files[0]; if(!f) return;
  const lector = new FileReader();
  lector.onload = () => {
    try{
      const d = JSON.parse(lector.result);
      if(!d || !Array.isArray(d.evaluaciones)) throw 0;
      if(!confirm(`La copia tiene ${d.evaluaciones.length} flores. ¿Reemplazar tus datos actuales por la copia?`)) return;
      D = {evaluaciones: d.evaluaciones};
      guardar(); aviso('Copia recuperada ✓'); ir('inicio');
    }catch(e){ aviso('Ese archivo no es una copia de Equilibra'); }
  };
  lector.readAsText(f);
  inp.value = '';
}
function borrarTodo(){
  if(!confirm('¿Borrar todas tus flores y acciones? No se puede deshacer.')) return;
  if(!confirm('¿Seguro? Se borrará todo tu jardín de Equilibra en este dispositivo.')) return;
  D = {evaluaciones: []}; guardar(); aviso('Datos borrados'); ir('inicio');
}

/* ---------- Aviso flotante ---------- */
let tToast;
function aviso(t){ const el = $('#toast'); el.textContent = t; el.classList.add('ver'); clearTimeout(tToast); tToast = setTimeout(() => el.classList.remove('ver'), 2400); }

/* ---------- Grow Panel: resumen de la app (Grow Panel\BOTON.md) ---------- */
function enviarResumen(){
  const u = ultima();
  let r;
  if(!u){
    r = {estado:'aviso', mensaje:'Aún no has hecho tu primera flor', cifras:[], version:VERSION};
  }else{
    const sem = semanasDesde(u), baja = ordenadas(u.notas)[0];
    let msg = sem > 0 ? 'Toca la flor de esta semana' : u.accion && !u.accion.hecha ? `Acción: ${u.accion.texto}` : `Pétalo a cuidar: ${baja.nombre}`;
    if(msg.length > 90) msg = msg.slice(0, 89) + '…';
    r = {estado: sem > 0 ? 'aviso' : 'ok', mensaje: msg, version: VERSION, cifras:[
      {valor: fmt(media(u.notas)) + '/10', etiqueta:'media de tu flor'},
      {valor: sem === 0 ? '✓' : sem + ' sem', etiqueta: sem === 0 ? 'flor de esta semana' : 'desde la última flor'},
      {valor: D.evaluaciones.length, etiqueta: D.evaluaciones.length === 1 ? 'flor en el jardín' : 'flores en el jardín'}]};
  }
  window.growPanelResumen = r;
  try{ if(window.GrowPanel && GrowPanel.resumen) GrowPanel.resumen(r); }catch(e){}
}
addEventListener('growpanel-listo', enviarResumen);

/* ---------- Arranque ---------- */
(function iniciar(){
  const interior = logoInterior();
  ['#logo-splash','#logo-cab'].forEach(s => { const el = $(s); el.setAttribute('viewBox','-100 -100 200 200'); el.innerHTML = interior; });
  $('#favicon').href = 'data:image/svg+xml,' + encodeURIComponent(logoSVG().replace(/ class="[^"]*"| style="[^"]*"/g, ''));
  $('#ver').textContent = VERSION;
  $('#sellos-splash').innerHTML = sellosHTML();
  iconoSonido();
  render();
  enviarResumen();

  // Portada: la flor abre sus pétalos con una nota por pétalo
  const splash = $('#splash');
  for(let k = 0; k < 18; k++){
    const c = document.createElement('i'); c.className = 'chispa';
    const ang = Math.random()*Math.PI*2, dist = 90 + Math.random()*120;
    c.style.cssText = `left:50%;top:42%;--dx:${(Math.cos(ang)*dist).toFixed(0)}px;--dy:${(Math.sin(ang)*dist).toFixed(0)}px;animation-delay:${(1 + Math.random()*.8).toFixed(2)}s`;
    splash.appendChild(c);
  }
  let sonada = false;
  const tocarSonido = () => { if(sonada || !sonidoOn) return; const c = audio(); if(c && c.state === 'running'){ sonada = true; sonarPortada(); } };
  tocarSonido();
  // Los navegadores no dejan sonar nada hasta que la persona toca la pantalla
  if(!sonada && sonidoOn){
    setTimeout(() => { if(!sonada && ctxAudio && ctxAudio.state !== 'running') $('#tocar').classList.add('ver'); }, 300);
    setTimeout(tocarSonido, 120);
  }
  let cerrada = false;
  const cerrar = () => { if(cerrada) return; cerrada = true; splash.classList.add('fuera'); setTimeout(() => splash.remove(), 700); };
  splash.addEventListener('click', e => {
    if(e.target.closest('a')) return;
    if(!sonada && sonidoOn){ audio(); setTimeout(() => { tocarSonido(); }, 30); clearTimeout(tCerrar); tCerrar = setTimeout(cerrar, 1700); $('#tocar').classList.remove('ver'); return; }
    cerrar();
  });
  let tCerrar = setTimeout(cerrar, 3000);
})();
</script>
<script src="https://gcalabro12.github.io/Grow-Panel/grow-panel-boton.js" data-app="equilibra" data-nombre="Equilibra" defer></script>
</body>
